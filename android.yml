name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip.b64'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          base64 -d project.zip.b64 > project.zip
          unzip -oq project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: cd AnalisesEx && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AnalisesEx-debug-apk
          path: AnalisesEx/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
