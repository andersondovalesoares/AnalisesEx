name: Inspect Android project sources
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-project.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and print project setup
        run: |
          base64 -d project.zip.b64 > project.zip
          unzip -oq project.zip
          for f in AnalisesEx/settings.gradle.kts AnalisesEx/build.gradle.kts AnalisesEx/gradle.properties AnalisesEx/app/build.gradle.kts AnalisesEx/app/src/main/AndroidManifest.xml AnalisesEx/app/src/main/java/com/analisesex/MainActivity.kt AnalisesEx/app/src/main/java/com/analisesex/CaptureService.kt; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              cat "$f"
            fi
          done
          echo "===== ALL PROJECT FILES ====="
          find AnalisesEx/app/src/main -maxdepth 8 -type f -print
