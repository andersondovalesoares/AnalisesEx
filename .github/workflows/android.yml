name: Build Sinais Tela APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'project.zip.b64'
      - '.github/workflows/android.yml'
      - 'app-source/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          base64 -d project.zip.b64 > project.zip
          unzip -oq project.zip

      - name: Inspect Android configuration
        run: |
          echo "===== AndroidManifest.xml ====="
          cat AnalisesEx/app/src/main/AndroidManifest.xml
          echo "===== app/build.gradle.kts ====="
          cat AnalisesEx/app/build.gradle.kts
          echo "===== settings.gradle.kts ====="
          cat AnalisesEx/settings.gradle.kts

      - name: Fix broken Kotlin multiline string
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AnalisesEx/app/src/main/java/com/analisesex/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = 'box.addView(text("Autorize a captura da tela para iniciar.\n\nEsta versão é uma base técnica: ainda não produz sinais CALL/PUT confiáveis.",15f))'
          new = 'box.addView(text("Autorize a captura da tela para iniciar.\\n\\nEsta versão é uma base técnica: ainda não produz sinais CALL/PUT confiáveis.",15f))'
          if old not in s:
              raise SystemExit("Não encontrei o trecho Kotlin esperado; arquivo não alterado.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("String corrigida sem alterar as funções do aplicativo.")
          PY

      - name: Prepare update-compatible app and Portuguese status notification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("AnalisesEx/app/src/main")
          manifest = root / "AndroidManifest.xml"
          m = manifest.read_text(encoding="utf-8")
          if 'android.permission.POST_NOTIFICATIONS' not in m:
              m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>')
          m = m.replace('android:label="Análises Ex"', 'android:label="Sinais Tela"')
          manifest.write_text(m, encoding="utf-8")

          gradle = Path("AnalisesEx/app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          g = g.replace('versionCode = 1; versionName = "1.0"', 'versionCode = 3; versionName = "1.2"')
          gradle.write_text(g, encoding="utf-8")

          activity = root / "java/com/analisesex/MainActivity.kt"
          a = activity.read_text(encoding="utf-8")
          if 'android.os.Build' not in a:
              a = a.replace('import android.os.Bundle', 'import android.os.Bundle\\nimport android.os.Build\\nimport android.content.pm.PackageManager')
          a = a.replace('val m=getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager',
                        'if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) { requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 502) }\\n   val m=getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager')
          activity.write_text(a, encoding="utf-8")

          service = root / "java/com/analisesex/CaptureService.kt"
          s = service.read_text(encoding="utf-8")
          s = s.replace('setContentText("Captura de tela ativa")', 'setContentText("Captura ativa • aguardando confirmação")')
          s = s.replace('setContentTitle("Análises Ex")', 'setContentTitle("Sinais Tela")')
          service.write_text(s, encoding="utf-8")
          print("Atualização preparada: versão 1.2, nome Sinais Tela e notificação em português.")
          PY

      - name: Apply Sinais Tela notification updates
        run: |
          cp patches/MainActivity.kt AnalisesEx/app/src/main/java/com/analisesex/MainActivity.kt
          cp patches/CaptureService.kt AnalisesEx/app/src/main/java/com/analisesex/CaptureService.kt
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("AnalisesEx/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          source = source.replace('android:label="Análises Ex"', 'android:label="Sinais Tela"')
          permission = ' <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
          if "android.permission.POST_NOTIFICATIONS" not in source:
              source = source.replace("</manifest>", permission + "</manifest>")
          manifest.write_text(source, encoding="utf-8")

          gradle = Path("AnalisesEx/app/build.gradle.kts")
          build = gradle.read_text(encoding="utf-8")
          build = build.replace('versionCode = 1; versionName = "1.0"', 'versionCode = 2; versionName = "1.1"')
          gradle.write_text(build, encoding="utf-8")
          print("Tela em português, permissão de notificações e versão 1.2 aplicadas.")
          PY
          echo "===== Manifest atualizado ====="
          cat AnalisesEx/app/src/main/AndroidManifest.xml
          echo "===== Versão do aplicativo ====="
          grep -n "versionCode\|versionName" AnalisesEx/app/build.gradle.kts

      - name: Inspect Sinais Tela source
        run: |
          echo "===== MainActivity.kt ====="
          nl -ba AnalisesEx/app/src/main/java/com/analisesex/MainActivity.kt | head -100
          echo "===== CaptureService.kt ====="
          nl -ba AnalisesEx/app/src/main/java/com/analisesex/CaptureService.kt | head -100

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin JVM targets
        run: |
          cat > /tmp/align-jvm-targets.gradle <<'EOF'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: cd AnalisesEx && gradle -I /tmp/align-jvm-targets.gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Sinais-Tela-debug-apk
          path: AnalisesEx/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
