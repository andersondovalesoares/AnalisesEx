name: Build Sinais Tela APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'project.zip.b64'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          base64 -d project.zip.b64 > project.zip
          unzip -oq project.zip

      - name: Fix broken Kotlin multiline string
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AnalisesEx/app/src/main/java/com/analisesex/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = 'box.addView(text("Autorize a captura da tela para iniciar.\n\nEsta versão é uma base técnica: ainda não produz sinais CALL/PUT confiáveis.",15f))'
          new = 'box.addView(text("Autorize a captura da tela para iniciar.\\n\\nEsta versão é uma base técnica: ainda não produz sinais CALL/PUT confiáveis.",15f))'
          if old not in s:
              raise SystemExit("Não encontrei o trecho Kotlin esperado; arquivo não alterado.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("String corrigida sem alterar as funções do aplicativo.")
          PY

      - name: Inspect Sinais Tela source
        run: |
          echo "===== MainActivity.kt ====="
          nl -ba AnalisesEx/app/src/main/java/com/analisesex/MainActivity.kt | head -100
          echo "===== CaptureService.kt ====="
          nl -ba AnalisesEx/app/src/main/java/com/analisesex/CaptureService.kt | head -100

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin JVM targets
        run: |
          cat > /tmp/align-jvm-targets.gradle <<'EOF'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: cd AnalisesEx && gradle -I /tmp/align-jvm-targets.gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Sinais-Tela-debug-apk
          path: AnalisesEx/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
